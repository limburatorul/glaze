<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Glaze settings</title>
<style>
  :root { --accent: #8b5cf6; --text: #f2f2f5; --muted: rgba(242, 242, 245, 0.6); }
  html, body { margin: 0; background: transparent; color: var(--text); font: 14px/1.4 "Segoe UI Variable", "Segoe UI", sans-serif; }
  body { padding: 16px; }
  section {
    background: rgba(20, 20, 26, 0.45); border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px; padding: 4px 14px; margin-bottom: 12px;
  }
  h2 { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 10px 0 4px; }
  label { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; cursor: pointer; }
  label + label { border-top: 1px solid rgba(255, 255, 255, 0.06); }
  output { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }
  .range { display: flex; align-items: center; gap: 10px; flex: 1; justify-content: flex-end; }

  /* switch */
  input[type=checkbox] {
    appearance: none; width: 36px; height: 20px; border-radius: 10px; margin: 0; flex: none; cursor: pointer;
    background: rgba(255, 255, 255, 0.16); position: relative; transition: background .15s;
  }
  input[type=checkbox]::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; transition: transform .15s;
  }
  input[type=checkbox]:checked { background: var(--accent); }
  input[type=checkbox]:checked::after { transform: translateX(16px); }

  /* slider */
  input[type=range] { appearance: none; width: 160px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.16); margin: 0; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb {
    appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent);
    border: 2px solid #fff; box-sizing: border-box;
  }
  .links { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 10px 0; }
  .links a { color: var(--text); text-decoration: none; }
  .links a:hover { color: var(--accent); }
  .links span { color: var(--muted); user-select: text; }
  input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <section>
    <h2>Video page</h2>
    <label>Suggestions <input type="checkbox" data-key="related"></label>
    <label>Comments <input type="checkbox" data-key="comments"></label>
    <label>Title and description under the player <input type="checkbox" data-key="info"></label>
    <label>Blurred video in the margins <input type="checkbox" data-key="ambient"></label>
  </section>
  <section>
    <h2>Window</h2>
    <label>Always on top <input type="checkbox" data-key="onTop"></label>
  </section>
  <section>
    <h2>Glass</h2>
    <label>Blur strength
      <span class="range"><input type="range" data-key="blur" min="0" max="2" step="0.25"><output></output></span>
    </label>
  </section>
  <section>
    <h2>Video grid</h2>
    <label>Card width
      <span class="range"><input type="range" data-key="card" min="180" max="600" step="10"><output></output></span>
    </label>
  </section>
  <section>
    <h2>Glaze</h2>
    <div class="links">
      <a href="mailto:feedback@protagonistlabs.app?subject=Glaze%20feedback">Send feedback</a>
      <span>feedback@protagonistlabs.app</span>
      <a href="https://protagonistlabs.app/glaze/?utm_source=glaze&amp;utm_medium=app&amp;utm_campaign=settings">Website</a>
      <a href="https://protagonistlabs.app/?utm_source=glaze&amp;utm_medium=app&amp;utm_campaign=more-apps">More apps from Protagonist Labs</a>
    </div>
  </section>
<script>
  const show = { blur: v => v === 0 ? 'off' : `${Math.round(v * 100)}%`, card: v => `${v}px` };
  window.ytPlayer.getSettings().then(settings => {
    for (const input of document.querySelectorAll('[data-key]')) {
      const key = input.dataset.key;
      const out = input.parentElement.querySelector('output');
      if (input.type === 'checkbox') input.checked = settings[key];
      else { input.value = settings[key]; out.textContent = show[key](settings[key]); }
      input.addEventListener('input', () => {
        const value = input.type === 'checkbox' ? input.checked : Number(input.value);
        if (out) out.textContent = show[key](value);
        window.ytPlayer.setSetting(key, value);
      });
    }
  });
</script>
</body>
</html>
